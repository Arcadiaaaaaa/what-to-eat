<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="录入你的餐品与饮品，按早/午/晚餐随机推荐今天吃什么。">
  <meta name="theme-color" content="#e8590c">
  <title>今天吃什么 · 随机餐品推荐</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍚</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>今天吃什么 🍚</h1>
      <p class="subtitle">录入餐品与饮品，随机帮你拿主意</p>
    </header>

    <nav class="tabs" id="mealTabs">
      <button type="button" class="tab active" data-meal="breakfast">🌅 早餐</button>
      <button type="button" class="tab" data-meal="lunch">☀️ 午餐</button>
      <button type="button" class="tab" data-meal="dinner">🌙 晚餐</button>
    </nav>

    <main class="layout">
      <section class="panel form-panel">
        <h2>录入餐品 / 饮品</h2>
        <form id="addItemForm" novalidate>
          <label class="field">
            <span class="field-label">名称</span>
            <input type="text" id="itemName" placeholder="如：肉夹馍" maxlength="30" autocomplete="off">
          </label>
          <label class="field">
            <span class="field-label">价格（可留空）</span>
            <input type="number" id="itemPrice" placeholder="¥" min="0" step="any" inputmode="decimal">
          </label>
          <div class="field">
            <span class="field-label">类别</span>
            <div class="type-toggle">
              <label class="choice"><input type="radio" name="itemType" value="food" checked><span class="chip type-food">🍚 餐品</span></label>
              <label class="choice"><input type="radio" name="itemType" value="drink"><span class="chip type-drink">🥤 饮品</span></label>
            </div>
          </div>
          <fieldset class="meal-picker">
            <legend class="field-label">适用于</legend>
            <div class="meal-options">
              <label class="choice"><input type="checkbox" name="meal" value="breakfast" checked><span class="chip meal-chip">早餐</span></label>
              <label class="choice"><input type="checkbox" name="meal" value="lunch"><span class="chip meal-chip">午餐</span></label>
              <label class="choice"><input type="checkbox" name="meal" value="dinner"><span class="chip meal-chip">晚餐</span></label>
            </div>
          </fieldset>
          <button type="submit" class="btn primary">＋ 添加到清单</button>
          <p class="error" id="formError" hidden></p>
        </form>
      </section>

      <section class="panel list-panel">
        <h2 id="listTitle">🌅 早餐清单</h2>
        <ul id="itemList" class="item-list"></ul>
        <div id="emptyState" class="empty" hidden>
          <p>这个餐段还没有录入任何东西</p>
          <button type="button" class="btn ghost" id="loadSample">加载示例数据试试</button>
        </div>
      </section>

      <section class="panel result-panel">
        <h2>随机推荐</h2>
        <div class="mode-toggle" id="modeToggle">
          <button type="button" class="mode active" data-mode="combo">餐品 + 饮品</button>
          <button type="button" class="mode" data-mode="food">仅餐品</button>
          <button type="button" class="mode" data-mode="drink">仅饮品</button>
        </div>
        <button type="button" class="btn roll" id="rollBtn">🎲 随机推荐</button>
        <div class="result" id="result">
          <p class="placeholder">点击上方按钮，帮你拿主意</p>
        </div>
      </section>
    </main>

    <footer>
      <div class="data-actions">
        <button type="button" class="btn ghost small" id="exportBtn">导出数据</button>
        <button type="button" class="btn ghost small" id="importBtn">导入数据</button>
        <input type="file" id="importFile" accept="application/json,.json" hidden>
      </div>
      <p>数据保存在当前浏览器本地（localStorage），不会上传 · v0.1 MVP</p>
    </footer>
  </div>

  <div id="toast" class="toast" aria-live="polite" hidden></div>
  <script src="app.js"></script>
</body>
</html>
