name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 未配置 CLOUDFLARE_API_TOKEN secret 时静默跳过（配置后自动生效）
    if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: d910724af9b6bbb5224d0092bea287e7
          command: pages deploy . --project-name=what-to-eat --branch=main
